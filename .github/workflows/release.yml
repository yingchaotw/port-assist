name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build Portable (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            bin_name: port-assist.exe
            asset_name: PortAssist-windows-x64.exe
          - os: macos-latest
            target: macos-arm64
            bin_name: port-assist
            asset_name: PortAssist-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package Windows portable executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri/target/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"

      - name: Package macOS portable archive
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/PortAssist
          cp "src-tauri/target/release/${{ matrix.bin_name }}" dist/PortAssist/
          cp README.md LICENSE dist/PortAssist/
          tar -czf "dist/${{ matrix.asset_name }}" -C dist PortAssist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: PortAssist ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/*
