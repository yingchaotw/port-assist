[package]
name = "accessport-rust"
version = "0.1.0"
description = "SUDT AccessPort Replica for RS232/422/485 Serial Port in Rust + Tauri"
authors = ["AccessPort Rust"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
